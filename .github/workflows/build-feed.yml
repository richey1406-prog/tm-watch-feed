name: build-feed

on:
  schedule:
    # Daily, after USPTO posts the previous day's TDXF file (morning ET).
    - cron: "30 9 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build feed from yesterday's TDXF file
        env:
          USPTO_ODP_API_KEY: ${{ secrets.USPTO_ODP_API_KEY }}
        run: python build_feed.py --daily

      - name: Commit and push feed updates
        run: |
          git config user.name "tm-watch-feed-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feed
          git diff --cached --quiet || git commit -m "feed: $(date -u +%F) run"
          git push
